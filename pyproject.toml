[project]
name = "remote-compute-mcp-gateway"
version = "0.1.0"
description = "Phase 1 isolated PoC for a pluggable remote compute MCP gateway"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "uvicorn>=0.34,<1",
  "mcp>=1.0,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
]

[tool.setuptools]
packages = ["gateway", "shared", "worker", "colab"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
